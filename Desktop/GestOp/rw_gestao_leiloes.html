<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RW Operacoes</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f3f2ef;--s:#fff;--s2:#edecea;--bd:#dedcda;
  --t:#17170e;--t2:#68655f;--t3:#9a9792;
  --a:#bf521a;--al:#fdeee4;--at:#7a320e;
  --g:#16693e;--gl:#e4f5ec;--gt:#0c3f25;
  --b:#1452a0;--bl:#e3edf8;--bt:#0b3168;
  --m:#9a6e10;--ml:#fdf4df;--mt:#5f4408;
  --r:#981818;--rl:#fde6e6;--rt:#601010;
  --p:#5a38ac;--pl:#ede9fa;--pt:#372270;
  --c:#0d7868;--cl:#e3f5f2;--ct:#084d43;
  --rad:8px;--radl:12px;
}
html,body{height:100%;font-family:'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--t);font-size:14px;line-height:1.5}
button{cursor:pointer;font:inherit;color:inherit;border:none;background:none}
input,select,textarea{font:inherit;color:var(--t);background:var(--s);border:1px solid var(--bd);border-radius:var(--rad);padding:6px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a)}
textarea{resize:vertical}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}

/* LAYOUT */
.app{display:flex;height:100vh;overflow:hidden}
.side{width:200px;background:var(--s);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.side-logo{padding:16px 14px 12px;border-bottom:1px solid var(--bd)}
.logo-brand{font-size:17px;font-weight:800;color:var(--a)}
.logo-sub{font-size:10px;color:var(--t3);margin-top:1px}
.side-user{margin:8px;border-radius:var(--rad);background:var(--s2);padding:7px 9px;cursor:pointer;display:flex;align-items:center;gap:7px;border:1px solid var(--bd);transition:border-color .12s}
.side-user:hover{border-color:var(--a)}
.u-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.u-nm{font-size:12px;font-weight:600;flex:1}
.u-rl{font-size:10px;color:var(--t3)}
nav{padding:5px;flex:1;overflow-y:auto}
.nav-sec{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;padding:8px 8px 3px}
.nb{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:var(--rad);color:var(--t2);width:100%;text-align:left;font-size:12px;transition:all .1s}
.nb:hover{background:var(--s2);color:var(--t)}
.nb.act{background:var(--al);color:var(--at);font-weight:700}
.nb-ico{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.side-foot{padding:8px 10px;border-top:1px solid var(--bd);font-size:10px;color:var(--t3)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--s);border-bottom:1px solid var(--bd);padding:9px 20px;display:flex;align-items:center;gap:10px;min-height:48px}
.tb-ttl{font-size:14px;font-weight:700;flex:1}
.tb-date{font-size:12px;color:var(--t2)}
.content{flex:1;overflow-y:auto;padding:18px 20px}

/* BADGES */
.b{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
.bg{background:var(--gl);color:var(--gt)} .bb{background:var(--bl);color:var(--bt)}
.bm{background:var(--ml);color:var(--mt)} .br{background:var(--rl);color:var(--rt)}
.bz{background:var(--s2);color:var(--t2)} .ba{background:var(--al);color:var(--at)}
.bp{background:var(--pl);color:var(--pt)} .bc{background:var(--cl);color:var(--ct)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--rad);font-size:12px;font-weight:600;cursor:pointer;transition:opacity .12s,background .12s;border:1px solid transparent;white-space:nowrap}
.btn-a{background:var(--a);color:#fff;border-color:var(--a)}.btn-a:hover{opacity:.84}
.btn-g{background:var(--g);color:#fff;border-color:var(--g)}.btn-g:hover{opacity:.84}
.btn-b{background:var(--b);color:#fff;border-color:var(--b)}.btn-b:hover{opacity:.84}
.btn-s{background:var(--s2);color:var(--t);border-color:var(--bd)}.btn-s:hover{background:var(--bd)}
.btn-r{background:var(--r);color:#fff;border-color:var(--r)}.btn-r:hover{opacity:.84}
.btn-sm{padding:3px 8px;font-size:11px} .btn-xs{padding:2px 6px;font-size:10px}

/* METRICS */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.mc{background:var(--s2);border-radius:var(--rad);padding:10px 13px}
.mc-l{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.mc-v{font-size:20px;font-weight:700;line-height:1}

/* CARDS */
.card{background:var(--s);border:1px solid var(--bd);border-radius:var(--radl);padding:14px 16px;margin-bottom:12px}
.card-t{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}

/* EVENT LIST */
.ev-list{display:flex;flex-direction:column;gap:7px}
.ev{background:var(--s);border:1px solid var(--bd);border-radius:var(--radl);padding:11px 13px;display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:start;transition:border-color .12s;cursor:default}
.ev:hover{border-color:var(--a)}
.ev.est{border-left:3px solid var(--b)}
.ev.ext{border-left:3px solid var(--g)}
.ev.nd{border-left:3px solid var(--bd)}
.ev.done{opacity:.85}
.ev-hi{font-size:14px;font-weight:800;font-family:'Courier New',monospace;color:var(--a);text-align:center}
.ev-hf{font-size:10px;color:var(--t3);font-family:'Courier New',monospace;text-align:center}
.ev-id{font-size:10px;color:var(--t3);font-family:'Courier New',monospace;text-align:center;margin-top:1px}
.ev-ttl{font-size:13px;font-weight:700;margin-bottom:4px;line-height:1.3}
.ev-meta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.ev-ops{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:4px}
.ev-acts{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.op-chip{font-size:10px;font-weight:600;padding:2px 6px;border-radius:20px;border:1px solid;background:transparent;cursor:default}
.op-add{font-size:10px;padding:2px 7px;border-radius:20px;border:1px dashed var(--bd);color:var(--t3);cursor:pointer;transition:all .12s}
.op-add:hover{border-color:var(--a);color:var(--a)}
.t-grp{margin-bottom:16px}
.t-lbl{font-size:10px;font-weight:800;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--r);display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

/* TABLE */
.tw{overflow-x:auto;border-radius:var(--radl);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;background:var(--s)}
thead{background:var(--s2)}
th{padding:8px 11px;text-align:left;font-size:10px;font-weight:700;color:var(--t2);border-bottom:1px solid var(--bd);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
td{padding:7px 11px;border-bottom:1px solid var(--bd);font-size:12px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--s2)}
.mono{font-family:'Courier New',monospace;font-size:11px;color:var(--t2)}

/* ESCALA */
.ew{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--radl)}
.et{border-collapse:collapse;font-size:11px}
.et th,.et td{border:1px solid var(--bd);padding:2px 3px;text-align:center}
.et th{white-space:nowrap}
.et td{vertical-align:top;min-width:28px}
.et thead th{background:var(--s2);font-weight:700;color:var(--t2);font-size:10px}
.et .en{text-align:left;font-weight:600;padding:4px 8px;position:sticky;left:0;background:var(--s);z-index:2;min-width:120px;font-size:11px}
.ev-sc{font-size:9px;text-align:left;padding:2px 4px;border-radius:3px;margin-bottom:2px;cursor:pointer;line-height:1.3;width:86px;display:block;overflow:hidden}
.cf{background:var(--rl);color:var(--rt);font-weight:700;font-size:9px;border-radius:3px;padding:1px 3px}
.ce{background:var(--ml);color:var(--mt);font-weight:700;font-size:9px;border-radius:3px;padding:1px 3px}
.cw{font-weight:700;font-size:9px;border-radius:3px;padding:1px 3px}
.cw-est{background:var(--bl);color:var(--bt)}
.cw-ext{background:var(--gl);color:var(--gt)}
.cd{color:var(--bd);font-size:11px}
.ct{outline:2px solid var(--a);outline-offset:-1px}
.cwe{background:var(--s2)}

/* CALENDAR */
.cal-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-nav{display:flex;gap:5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;min-height:500px}
.cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;padding:4px;background:var(--s2);border-radius:var(--rad) var(--rad) 0 0}
.cal-day{background:var(--s);border:1px solid var(--bd);border-radius:var(--rad);padding:5px;min-height:90px;cursor:pointer;transition:border-color .12s;position:relative;overflow:hidden}
.cal-day:hover{border-color:var(--a)}
.cal-day.other{background:var(--s2);opacity:.6}
.cal-day.today{border-color:var(--a);border-width:2px}
.cal-day.selected{background:var(--al)}
.cal-num{font-size:11px;font-weight:700;margin-bottom:3px}
.cal-ev-chip{font-size:9px;font-weight:600;padding:2px 5px;border-radius:3px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cal-ev-chip.est{background:var(--bl);color:var(--bt)}
.cal-ev-chip.ext{background:var(--gl);color:var(--gt)}
.cal-ev-chip.nd{background:var(--s2);color:var(--t2)}
.cal-ev-chip.done{opacity:.7}

/* MODAL */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:9999;display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow-y:auto}
.modal{background:var(--s);border-radius:var(--radl);border:1px solid var(--bd);width:100%;max-width:560px;margin:auto}
.modal-lg{max-width:740px}
.mh{padding:14px 16px 11px;border-bottom:1px solid var(--bd);display:flex;align-items:flex-start;gap:9px}
.mt{font-size:13px;font-weight:700;flex:1} .ms{font-size:11px;color:var(--t2);margin-top:1px}
.mx{color:var(--t2);font-size:14px;cursor:pointer;padding:3px 5px;border-radius:4px}
.mx:hover{background:var(--s2)}
.mb{padding:14px 16px} .mf{padding:10px 16px;border-top:1px solid var(--bd);display:flex;gap:6px;justify-content:flex-end}

/* FORMS */
.fg{margin-bottom:11px} .fg label{font-size:10px;font-weight:700;color:var(--t2);margin-bottom:3px;display:block;text-transform:uppercase;letter-spacing:.04em}
.fg input,.fg select,.fg textarea{width:100%}
.gr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.gr4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.sec{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin:13px 0 7px;padding-bottom:3px;border-bottom:1px solid var(--bd)}
.divider{border:none;border-top:1px solid var(--bd);margin:12px 0}

/* OP SELECTOR */
.op-grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.opt{padding:4px 9px;border-radius:20px;border:1px solid var(--bd);font-size:11px;cursor:pointer;background:var(--s);color:var(--t2);transition:all .12s}
.opt:hover:not(:disabled){border-color:var(--a);color:var(--a)}
.opt:disabled{opacity:.35;cursor:not-allowed}
.opt.sel{color:#fff}

/* TIPO SELECTOR */
.tipo-sel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.tc{border:2px solid var(--bd);border-radius:var(--radl);padding:12px;cursor:pointer;transition:all .14s;text-align:center}
.tc:hover{border-color:var(--a)}
.tc.sel-e{border-color:var(--b);background:var(--bl)}
.tc.sel-x{border-color:var(--g);background:var(--gl)}
.tc.sel-n{border-color:var(--bd);background:var(--s2)}
.tc-ico{font-size:22px;margin-bottom:4px}
.tc-t{font-size:12px;font-weight:700}
.tc-s{font-size:10px;color:var(--t2);margin-top:2px}

/* EXPENSE ROWS */
.exp-r{display:grid;grid-template-columns:80px 1fr 80px 28px;gap:6px;align-items:center;margin-bottom:6px}
.exp-total{text-align:right;font-size:12px;font-weight:700;color:var(--a);padding-top:6px;border-top:1px solid var(--bd)}

/* FINANCEIRO */
.fin-s{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.fc{border-radius:var(--rad);padding:10px 12px;text-align:center}
.fc.rec{background:var(--gl)} .fc.des{background:var(--rl)} .fc.liq{background:var(--bl)}
.fc-l{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase}
.fc-v{font-size:17px;font-weight:800;margin-top:3px}
.pay-r{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12px}
.pay-r:last-child{border:none;font-weight:700;font-size:13px}

/* WEEK STRIP */
.ws{display:flex;gap:5px;overflow-x:auto;padding-bottom:5px;margin-bottom:14px}
.wd{flex-shrink:0;width:64px;border-radius:var(--rad);border:1px solid var(--bd);padding:7px 5px;text-align:center;cursor:pointer;transition:all .12s;background:var(--s)}
.wd:hover{border-color:var(--a)}
.wd.today{border-color:var(--a);background:var(--al)}
.wd.sel{background:var(--al);border-color:var(--a)}
.wd.has{background:var(--s2)}
.wd-dow{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase}
.wd-n{font-size:18px;font-weight:800;color:var(--t);line-height:1.1;margin:2px 0}
.wd-c{font-size:9px;color:var(--t2)}
.wd.we .wd-n{color:var(--m)}

/* USER SCREEN */
.us-ovl{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;align-items:center;justify-content:center}
.us-panel{background:var(--s);border-radius:var(--radl);border:1px solid var(--bd);padding:28px;max-width:500px;width:100%}
.us-panel h2{font-size:19px;font-weight:800;margin-bottom:3px}
.us-panel p{font-size:12px;color:var(--t2);margin-bottom:20px}
.us-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.ub{border:1px solid var(--bd);border-radius:var(--radl);padding:12px 8px;text-align:center;cursor:pointer;transition:all .14s;background:var(--s)}
.ub:hover{border-color:var(--a);background:var(--al)}
.ub-av{width:40px;height:40px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff}
.ub-nm{font-size:11px;font-weight:700}
.ub-tp{font-size:9px;color:var(--t3);margin-top:1px}

/* API STATUS */
.api-status{display:flex;align-items:center;gap:6px;font-size:11px;padding:6px 10px;border-radius:var(--rad);margin-bottom:12px}
.api-ok{background:var(--gl);color:var(--gt)}
.api-err{background:var(--rl);color:var(--rt)}
.api-loading{background:var(--ml);color:var(--mt)}
.dot-pulse{animation:pulse 1s infinite}

/* EXPORT MODAL */
.period-sel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.period-sel label{font-size:11px;font-weight:700;color:var(--t2)}
.period-sel input{width:140px}

.empty{text-align:center;padding:36px;color:var(--t3);font-size:12px}
.tag-e{background:var(--bl);color:var(--bt);font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px}
.tag-x{background:var(--gl);color:var(--gt);font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px}
.tag-n{background:var(--s2);color:var(--t3);font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px}
.fw7{font-weight:700} .tg{color:var(--gt)} .tr{color:var(--rt)} .ta{color:var(--at)}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="us-ovl" id="us-ovl">
  <div class="us-panel" style="max-width:360px">
    <div style="text-align:center;margin-bottom:22px">
      <div class="logo-brand" style="font-size:24px">RemateWeb</div>
      <div style="font-size:11px;color:var(--t3);margin-top:3px">Gestao de Operacoes</div>
    </div>
    <div class="fg"><label>Usuario</label><input id="lg-user" type="text" placeholder="seu.usuario" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('lg-pass').focus()" style="font-size:14px;padding:9px 12px"></div>
    <div class="fg" style="margin-bottom:16px"><label>Senha</label><input id="lg-pass" type="password" placeholder="senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')loginUser()" style="font-size:14px;padding:9px 12px"></div>
    <button class="btn btn-a" style="width:100%;justify-content:center;padding:10px;font-size:13px" onclick="loginUser()">Entrar</button>
    <div id="lg-err" style="display:none;margin-top:10px;background:var(--rl);color:var(--rt);border-radius:var(--rad);padding:8px 12px;font-size:12px;font-weight:600">Usuario ou senha incorretos.</div>
  </div>
</div>

<div class="app" id="app" style="display:none">
<aside class="side">
  <div class="side-logo"><div class="logo-brand">RemateWeb</div><div class="logo-sub">Gestao de Operacoes</div></div>
  <div class="side-user" onclick="logout()" id="s-usr" title="Trocar usuario">
    <div class="u-av" id="u-av"></div>
    <div><div class="u-nm" id="u-nm"></div><div class="u-rl" id="u-rl"></div></div>
    <span style="font-size:12px;color:var(--t3)">&#8635;</span>
  </div>
  <nav>
    <div class="nav-sec">Agenda</div>
    <button class="nb act" onclick="sv('agenda')"><span class="nb-ico">&#128197;</span>Agenda</button>
    <button class="nb" onclick="sv('calendar')"><span class="nb-ico">&#128468;</span>Calendario</button>
    <div class="nav-sec">Operacoes</div>
    <button class="nb" onclick="sv('leiloes')"><span class="nb-ico">&#128296;</span>Leiloes</button>
    <button class="nb" onclick="sv('escala')"><span class="nb-ico">&#128100;</span>Escala</button>
    <button class="nb" onclick="sv('financeiro')"><span class="nb-ico">&#128176;</span>Financeiro</button>
    <div class="nav-sec">Pos-Evento</div>
    <button class="nb" onclick="sv('realizados')"><span class="nb-ico">&#10003;</span>Realizados</button>
    <div class="nav-sec">Sistema</div>
    <button class="nb" onclick="sv('importar')"><span class="nb-ico">&#9729;</span>Sincronizar</button>
    <button class="nb" onclick="sv('usuarios')"><span class="nb-ico">&#128100;</span>Usuarios</button>
    <button class="nb" onclick="sv('config')"><span class="nb-ico">&#9881;</span>Configuracoes</button>
  </nav>
  <div class="side-foot">
    <span id="api-dot" style="color:var(--g)">&#9679;</span> <span id="api-lbl">Pronto</span><br>
    <span id="ttl-ev">0</span> leiloes carregados
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="tb-ttl" id="vw-ttl">Agenda</div>
    <div class="tb-date" id="tb-dt"></div>
    <input type="date" id="dt-pk" style="width:145px" onchange="onDC(this.value)">
    <button class="btn btn-b btn-sm" id="btn-sync" onclick="doSync()" title="Sincronizar leiloes da API">&#8635; Sincronizar</button>
    <button class="btn btn-s btn-sm" id="btn-new" style="display:none" onclick="openNewEv()">+ Novo</button>
  </div>
  <div class="content" id="ct"></div>
</main>
</div>

<!-- MODAL -->
<div class="ovl" id="ovl" style="display:none" onclick="ocli(event)">
  <div class="modal" id="modal">
    <div class="mh"><div style="flex:1"><div class="mt" id="m-t"></div><div class="ms" id="m-s"></div></div><button class="mx" onclick="cm()">&#10005;</button></div>
    <div class="mb" id="m-b"></div>
    <div class="mf" id="m-f"></div>
  </div>
</div>

<script>
/* ================================================================
   CONFIG & DATA
================================================================ */
var API_BASE = "https://test.api-net9.remateweb.com";
var API_TOKEN = null;

function fd(d){if(!d)return"";var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function fbrl(v){return"R$ "+(parseFloat(v)||0).toFixed(2).replace(".",",");}
function gop(id){for(var i=0;i<OPERATORS.length;i++)if(OPERATORS[i].id===id)return OPERATORS[i];return null;}
function fev(id){for(var i=0;i<events.length;i++)if(events[i].id===id)return events[i];return null;}
function gest(oid,day){var e=ESCALA_BASE[oid];if(!e)return null;return e[day]||null;}
function evd(d){var o=[];for(var i=0;i<events.length;i++)if(events[i].inicio===d)o.push(events[i]);return o;}
function ds(d){return"2026-05-"+(d<10?"0":"")+d;}
function isWE(dateStr){if(FERIADOS[dateStr])return true;var d=new Date(dateStr+"T12:00:00");return d.getDay()===0||d.getDay()===6;}
function hrs(hi,hf){if(!hi||!hf)return 0;var a=hi.split(":"),b=hf.split(":");var m1=+a[0]*60+ +a[1],m2=+b[0]*60+ +b[1];if(m2<m1)m2+=1440;return Math.round((m2-m1)/60*10)/10;}
function fmtTime(t){if(!t)return"";var p=t.toString().split(":");return p[0].padStart(2,"0")+":"+(p[1]||"00").padStart(2,"0");}

function calcPay(opId,dateStr,evId){
  var op=gop(opId);var ev=fev(evId);if(!op||!ev)return{v:0,d:""};
  var we=isWE(dateStr);
  var h=hrs(ev.hi_real||ev.hi,ev.hf_real||ev.hf);
  var isExt=ev.tipo_leilao==="externo";

  if(isExt&&op.emp==="funcionario"){
    var cnt=evd(dateStr).filter(function(e){return e.operadores.indexOf(opId)>=0&&e.status==="realizado";}).length;
    for(var i=0;i<PAY_CATS.length;i++){
      var r=PAY_CATS[i];
      if(r.emp===op.emp&&r.isExterno===true&&cnt>=r.diasMin&&cnt<=r.diasMax)
        return{v:r.valor,d:r.nome+" R$"+r.valor};
    }
    return{v:0,d:""};
  }
  var best=null;
  for(var i=0;i<PAY_CATS.length;i++){
    var r=PAY_CATS[i];
    if(r.emp!==op.emp)continue;
    if(r.isExterno===true)continue;
    if(r.isWE!==null&&r.isWE!==we)continue;
    if(!r.byHoras)continue;
    if(h>=r.hMin&&h<r.hMax){if(!best||r.hMin>best.hMin)best=r;}
  }
  if(best)return{v:best.valor,d:best.nome+" "+h.toFixed(1)+"h R$"+best.valor};
  if(op.emp==="funcionario"&&!isExt&&!we)return{v:0,d:"Estudio semana — sem adicional"};
  return{v:0,d:""};
}

function setApiStatus(st,msg){
  var dot=document.getElementById("api-dot");
  var lbl=document.getElementById("api-lbl");
  if(!dot)return;
  dot.style.color=st==="ok"?"var(--g)":st==="loading"?"var(--m)":"var(--r)";
  if(lbl)lbl.textContent=msg;
}

function loginAPI(){
  var user=document.getElementById("api-user").value.trim();
  var pass=document.getElementById("api-pass").value;
  if(!user||!pass){alert("Preencha usuario e senha.");return;}
  setApiStatus("loading","Conectando...");
  var fd2=new FormData();
  fd2.append("grant_type","password");
  fd2.append("username",user);
  fd2.append("password",pass);
  fetch(API_BASE+"/token",{method:"POST",body:fd2})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status+" — verifique usuario/senha");return r.json();})
    .then(function(data){
      var tok=data.access_token||data.token||data.accessToken||data.jwt||"";
      if(!tok)throw new Error("Token nao encontrado na resposta da API.");
      API_TOKEN=tok;API_OK=true;
      saveData();
      setApiStatus("ok","Conectado — API RemateWeb");
      render();
    })
    .catch(function(err){
      setApiStatus("err","Erro: "+err.message);
      alert("Falha ao conectar:\n"+err.message);
    });
}

function logoutAPI(){
  API_TOKEN=null;API_OK=false;_apiEndpointFound=null;
  try{localStorage.removeItem("rw_token");}catch(e){}
  setApiStatus("err","Desconectado");
  render();
}

/* ── Endpoints to try in order ── */
var API_ENDPOINTS_TRY = [
  "/api/auction?PageIndex=0&PageSize=500",
  "/api/auction?page=0&size=500",
  "/api/auction?skip=0&take=500",
  "/api/auction",
  "/api/auctions?PageIndex=0&PageSize=500",
  "/api/auctions",
  "/auction?PageIndex=0&PageSize=500",
  "/auction",
  "/api/leilao?PageIndex=0&PageSize=500",
  "/api/leilao",
  "/api/leiloes",
  "/api/v1/auction?PageIndex=0&PageSize=500",
  "/api/v1/auction",
];
var _apiEndpointFound = null; /* cache the working endpoint */

function fetchFromAPI(){
  if(!API_TOKEN){alert("Faca login primeiro.");sv("importar");return;}
  setApiStatus("loading","Buscando leiloes...");
  /* Use cached endpoint or start discovery */
  if(_apiEndpointFound){
    _fetchEndpoint(_apiEndpointFound,0);
  } else {
    _discoverEndpoint(0);
  }
}

function _discoverEndpoint(idx){
  if(idx>=API_ENDPOINTS_TRY.length){
    setApiStatus("err","Nenhum endpoint respondeu. Verifique o token.");
    alert("Nao foi possivel encontrar o endpoint da API.\nTente reconectar na aba Sincronizar.");
    return;
  }
  setApiStatus("loading","Testando endpoint "+(idx+1)+"/"+API_ENDPOINTS_TRY.length+"...");
  fetch(API_BASE+API_ENDPOINTS_TRY[idx],{
    headers:{"Authorization":"Bearer "+API_TOKEN,"Accept":"application/json","Content-Type":"application/json"}
  })
  .then(function(r){
    if(r.status===401||r.status===403){
      API_TOKEN=null;API_OK=false;saveData();
      throw new Error("Token invalido ou expirado — refaca o login");
    }
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json().then(function(body){return{r:r,body:body};});
  })
  .then(function(rb){
    var body=rb.body;
    var arr=Array.isArray(body)?body:(body.items||body.data||body.auctions||body.leiloes||body.results||body.content||[]);
    /* Try keys if still empty */
    if(!arr.length){for(var k in body){if(Array.isArray(body[k])&&body[k].length){arr=body[k];break;}}}
    if(!arr.length){
      /* Endpoint exists but returned empty — still cache it, move on */
      _apiEndpointFound=API_ENDPOINTS_TRY[idx];
      setApiStatus("ok","API ok — 0 leiloes no endpoint "+API_ENDPOINTS_TRY[idx]);
      alert("Endpoint encontrado mas retornou 0 leiloes.\nVerifique os filtros de data na API.");
      return;
    }
    _apiEndpointFound=API_ENDPOINTS_TRY[idx];
    var total=body.total||body.totalCount||body.count||arr.length;
    setApiStatus("loading","Processando "+arr.length+" de "+(total||arr.length)+" leiloes...");
    var res=processImport(arr,true);
    var msg="Sincronizado via "+API_ENDPOINTS_TRY[idx]+" — +"+res.added+" novos, ~"+res.upd+" atualizados";
    if(res.skipped)msg+=" ("+res.skipped+" anteriores a "+fd(CUTOFF_DATE)+" ignorados)";
    if(total>arr.length)msg+=" ["+arr.length+"/"+total+" — aumente PageSize se necessario]";
    setApiStatus("ok",msg);
  })
  .catch(function(err){
    if(err.message.indexOf("Token")>=0||err.message.indexOf("login")>=0){
      setApiStatus("err",err.message);
      alert(err.message);
      return;
    }
    /* Try next endpoint */
    _discoverEndpoint(idx+1);
  });
}

function _fetchEndpoint(ep,_unused){
  fetch(API_BASE+ep,{
    headers:{"Authorization":"Bearer "+API_TOKEN,"Accept":"application/json"}
  })
  .then(function(r){
    if(r.status===401||r.status===403){
      API_TOKEN=null;API_OK=false;_apiEndpointFound=null;saveData();
      throw new Error("Token expirado — refaca o login");
    }
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  })
  .then(function(body){
    var arr=Array.isArray(body)?body:(body.items||body.data||body.auctions||body.leiloes||body.results||body.content||[]);
    if(!arr.length){for(var k in body){if(Array.isArray(body[k])&&body[k].length){arr=body[k];break;}}}
    if(!arr.length){setApiStatus("ok","API ok — nenhum leilao retornado");return;}
    var res=processImport(arr,true);
    setApiStatus("ok","Sincronizado — +"+res.added+" novos, ~"+res.upd+" atualizados"+(res.skipped?" ("+res.skipped+" ignorados)":""));
  })
  .catch(function(err){
    if(err.message.indexOf("Token")>=0||err.message.indexOf("expirado")>=0){
      setApiStatus("err",err.message);alert(err.message);
    } else {
      /* Cached endpoint broke — re-discover */
      _apiEndpointFound=null;
      setApiStatus("loading","Endpoint mudou, redescobindo...");
      _discoverEndpoint(0);
    }
  });
}

function vFinanceiro(){
  if(!CUser.isAdmin)return'<div class="empty">&#128274; Apenas gestores.</div>';
  var totR=0,totD=0,totP=0;
  for(var i=0;i<events.length;i++){totR+=events[i].receita||0;var d=events[i].despesas||[];for(var j=0;j<d.length;j++)totD+=d[j].valor||0;}
  var opPay={};var seen={};
  for(var i=0;i<events.length;i++){
    var e=events[i];if(e.status!=="realizado")continue;
    for(var j=0;j<e.operadores.length;j++){
      var oid=e.operadores[j];var p=calcPay(oid,e.inicio,e.id);
      var op=gop(oid);if(!op)continue;
      var key=oid+"-"+e.inicio+"-viagem";
      if(op.emp==="funcionario"&&e.tipo_leilao==="externo"&&seen[key])continue;
      if(op.emp==="funcionario"&&e.tipo_leilao==="externo")seen[key]=true;
      if(!opPay[oid])opPay[oid]={v:0,items:[]};
      opPay[oid].v+=p.v;opPay[oid].items.push({ev:"#"+e.id+" "+e.titulo.substring(0,32),data:e.inicio,v:p.v,d:p.d});
    }
  }
  for(var k in opPay)totP+=opPay[k].v;
  var html='<div class="fin-s">'+
    '<div class="fc rec"><div class="fc-l">Receita Total</div><div class="fc-v tg">'+fbrl(totR)+'</div></div>'+
    '<div class="fc des"><div class="fc-l">Despesas + Pagamentos</div><div class="fc-v tr">'+fbrl(totD+totP)+'</div></div>'+
    '<div class="fc liq"><div class="fc-l">Resultado</div><div class="fc-v '+(totR-totD-totP>=0?"tg":"tr")+'">'+fbrl(totR-totD-totP)+'</div></div>'+
  '</div>';
  html+='<div class="card"><div class="card-t">Pagamentos por Operador</div>'+
    '<div class="tw"><table><thead><tr><th>Operador</th><th>Tipo</th><th>Eventos</th><th>A Pagar</th><th></th></tr></thead><tbody>';
  for(var i=0;i<OPERATORS.length;i++){var op=OPERATORS[i];var pd=opPay[op.id];if(!pd)continue;
    html+='<tr><td style="font-weight:700">'+op.nome+'</td><td>'+empbdg(op.emp)+'</td>'+
      '<td class="mono">'+pd.items.length+'</td><td style="font-weight:700;color:var(--a)">'+fbrl(pd.v)+'</td>'+
      '<td><button class="btn btn-s btn-xs" onclick="openPayDet('+op.id+')">Detalhe</button></td></tr>';
  }
  html+='</tbody></table></div></div>';
  html+='<div class="card"><div class="card-t">Despesas por Evento</div>'+
    '<div class="tw"><table><thead><tr><th>Evento</th><th>Tipo</th><th>Descricao</th><th>Operador</th><th>Valor</th></tr></thead><tbody>';
  for(var i=0;i<events.length;i++){var e=events[i];var des=e.despesas||[];
    for(var j=0;j<des.length;j++){var d=des[j];var op=gop(d.opId);
      html+='<tr><td style="font-size:11px">#'+e.id+' '+e.titulo.substring(0,28)+'</td>'+
        '<td><span class="b '+(d.tipo==="carro"?"bb":d.tipo==="hotel"?"bm":"bz")+'">'+d.tipo+'</span></td>'+
        '<td style="font-size:11px">'+d.desc+'</td><td style="font-size:11px">'+(op?op.nome:"—")+'</td>'+
        '<td style="font-weight:700">'+fbrl(d.valor)+'</td></tr>';
    }
  }
  html+='</tbody></table></div></div>';
  return html;
}

function savePayCat(id){
  function parseSel(v){if(v==="null")return null;if(v==="true")return true;return false;}
  var nm=document.getElementById("pc-nm").value.trim();
  if(!nm){alert("Informe o nome da categoria.");return;}
  var obj={
    id:id||(PAY_CATS.reduce(function(mx,r){return Math.max(mx,r.id);},0)+1),
    nome:nm,
    emp:document.getElementById("pc-emp").value,
    isExterno:parseSel(document.getElementById("pc-ext").value),
    isWE:parseSel(document.getElementById("pc-we").value),
    byHoras:document.getElementById("pc-bh").value==="true",
    hMin:parseFloat(document.getElementById("pc-hmin").value)||0,
    hMax:parseFloat(document.getElementById("pc-hmax").value)||999,
    diasMin:parseInt(document.getElementById("pc-dmin").value)||1,
    diasMax:parseInt(document.getElementById("pc-dmax").value)||99,
    valor:parseFloat(document.getElementById("pc-val").value)||0,
  };
  if(id){var idx=PAY_CATS.findIndex(function(r){return r.id===id;});if(idx>=0)PAY_CATS[idx]=obj;}
  else PAY_CATS.push(obj);
  saveData();cm();render();
}

function delPayCat(id){
  if(!confirm("Excluir esta categoria de remuneracao?"))return;
  PAY_CATS=PAY_CATS.filter(function(r){return r.id!==id;});
  saveData();render();
}

function addStudio(){

function delStudio(idx){

function renderTipoContent(e,day){

  var grupos_x=[{tipo:"externas",lbl:"RW / Externas"}];
  var grupos=e.tipo_leilao==="estudio"?grupos_e:e.tipo_leilao==="externo"?grupos_x:[];
  if(e.tipo_leilao==="estudio"){
    var estOpts='<option value="">-- Nao definido --</option>';
    for(var si=0;si<STUDIOS.length;si++)estOpts+='<option value="'+STUDIOS[si]+'"'+(e.estudio===STUDIOS[si]?" selected":"")+'>'+STUDIOS[si]+'</option>';

  }
  if(grupos.length>0){
    html+='<div class="sec">Operadores</div>';

      html+='<div style="font-size:10px;font-weight:700;color:var(--t3);margin:6px 0 3px;text-transform:uppercase">'+grupos[g].lbl+'</div>';
      html+='<div class="op-grid">';

        var op=OPERATORS[i];if(op.tipo!==grupos[g].tipo)continue;
        var st=gest(op.id,day);var isFolga=st&&st.indexOf("FOLGA")>=0;
        var isSel=e.operadores.indexOf(op.id)>=0;
        var stl=isSel?"background:"+op.cor+";border-color:"+op.cor+";color:#fff":"";
        html+='<button class="opt'+(isSel?" sel":"")+'" id="ob-'+op.id+'" onclick="togOp('+e.id+','+op.id+')" style="'+stl+'"'+(isFolga?' disabled title="'+st+'"':"")+'>'+
          op.nome+' '+empbdg(op.emp)+(st?' ('+st+')':'')+

    }

  if(e.tipo_leilao==="externo"){

function togOp(evId,opId){

    var d=desps[i];tot+=d.valor||0;
    var opO='<option value="">—</option>';for(var j=0;j<OPERATORS.length;j++)if(OPERATORS[j].tipo==="externas")opO+='<option value="'+OPERATORS[j].id+'"'+(d.opId===OPERATORS[j].id?" selected":"")+'>'+OPERATORS[j].nome+'</option>';

var _escOpId=null, _escDate=null;

function openEscalaDia(opId,dateStr){
  var op=gop(opId);if(!op)return;
  _escOpId=opId;_escDate=dateStr;
  var we=isWE(dateStr);
  var subLine=fd(dateStr)+(we?" <span class='b bm'>FDS/Feriado</span>":"")+" &mdash; "+empbdg(op.emp);
  sh("Escala: "+op.nome,subLine);
  document.getElementById("modal").classList.add("modal-lg");
  mb(buildEscalaDiaBody(opId,dateStr));
  mf('<button class="btn btn-s" onclick="cm();render()">Fechar</button>');
  openOvl();
}

function buildEscalaDiaBody(opId,dateStr){
  var op=gop(opId);if(!op)return"";
  var evs=evd(dateStr).sort(function(a,b){return a.hi>b.hi?1:-1;});
  var we=isWE(dateStr);

  /* Determine which event types are relevant to this operator */
  var relevantType=op.tipo==="externas"?"externo":
                   (op.tipo==="estudio"||op.tipo==="mt"||op.tipo==="painel")?"estudio":null;

  /* Separate: already assigned | matching type | other type | undefined */
  var assigned=[], matchOk=[], matchOther=[], undef=[];
  for(var i=0;i<evs.length;i++){
    var e=evs[i];
    if(e.operadores.indexOf(opId)>=0){assigned.push(e);}
    else if(e.tipo_leilao===relevantType){matchOk.push(e);}
    else if(e.tipo_leilao&&e.tipo_leilao!==relevantType){matchOther.push(e);}
    else{undef.push(e);}
  }

  var body="";

  /* ── ASSIGNED ── */
  body+='<div class="sec">Escalado neste dia ('+assigned.length+')</div>';
  if(assigned.length===0){
    body+='<div style="color:var(--t3);font-size:12px;padding:8px 0 10px">Nao escalado em nenhum leilao.</div>';
  } else {
    body+='<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:10px">';
    for(var i=0;i<assigned.length;i++){
      var e=assigned[i];
      var h=hrs(e.hi,e.hf);
      var pay=calcPay(opId,dateStr,e.id);
      var coOps="";for(var j=0;j<e.operadores.length;j++){if(e.operadores[j]!==opId){var co=gop(e.operadores[j]);if(co)coOps+=ochip(e.operadores[j]);}}
      body+='<div style="display:grid;grid-template-columns:56px 1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--gl);border:1px solid var(--g)">'+
        '<div style="text-align:center"><div class="ev-hi" style="font-size:13px">'+e.hi+'</div><div class="ev-hf">'+e.hf+'</div></div>'+
        '<div>'+
          '<div style="font-size:12px;font-weight:700">'+e.titulo.substring(0,48)+'</div>'+
          '<div style="display:flex;gap:4px;margin-top:3px;flex-wrap:wrap">'+
            tbdg(e.tipo_leilao)+cbdg(e.canal)+

          (notDef?'<div style="font-size:10px;color:var(--m);margin-top:2px">Tipo nao definido — sera definido como '+

  /* ── OTHER TYPE (info only) ── */
  if(matchOther.length>0){
    body+='<div class="sec">Outros leiloes do dia (tipo diferente)</div>'+
      '<div style="display:flex;flex-direction:column;gap:3px;margin-bottom:6px">';
    for(var i=0;i<matchOther.length;i++){
      var e=matchOther[i];
      body+='<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 8px;border-radius:6px;background:var(--s2);border:1px solid var(--bd);font-size:11px">'+

    }
    body+='</div>';
  }
  return body;
}

var CUTOFF_DATE = "2026-05-17"; /* eventos ate esta data sao ignorados na importacao */

function processImport(data, silent){
  var added=0, upd=0, skipped=0;

  function mdt(v){if(!v)return"";var s=v+"";if(s.indexOf("T")>=0)s=s.split("T")[0];/* handle dd/MM/yyyy */ if(s.match(/^\d{2}\/\d{2}\/\d{4}$/)){var p=s.split("/");return p[2]+"-"+p[1]+"-"+p[0];}return s;}
  function mtm(v){if(!v)return"";var p=(v+"").split(":");return(p[0]||"00").padStart(2,"0")+":"+(p[1]||"00").padStart(2,"0");}
  function mapItem(item){
    /* Extrai data de campos ISO ou datetime completo */
    function extractDate(v){
      if(!v)return"";
      var s=v+"";
      /* ISO datetime: 2026-05-19T19:00:00 -> 2026-05-19 */
      if(s.indexOf("T")>=0)s=s.split("T")[0];
      /* dd/MM/yyyy -> yyyy-MM-dd */
      if(s.match(/^\d{2}\/\d{2}\/\d{4}$/)){var p=s.split("/");return p[2]+"-"+p[1]+"-"+p[0];}
      return s;
    }
    /* Extrai hora de campo datetime ou string HH:mm */
    function extractTime(v,fallback){
      if(!v)return fallback||"";
      var s=v+"";
      /* ISO datetime: pega parte da hora */
      if(s.indexOf("T")>=0){var tp=s.split("T")[1];if(tp)s=tp.substring(0,5);}
      var p=s.split(":");
      return(p[0]||"00").padStart(2,"0")+":"+(p[1]||"00").padStart(2,"0");
    }
    /* Prioridade de campos de data inicio */
    var rawDate=item.inicio||item.date||item.startDate||item.start_date||item.startAt||item.dataInicio||"";
    /* Prioridade de campos de hora inicio */
    var rawHi=item.hi||item.hora_inicio||item.startTime||item.start_time||item.horaInicio||item.startHour||"";
    /* Se nao ha campo de hora separado, tenta extrair do datetime */
    if(!rawHi&&rawDate&&rawDate.indexOf("T")>=0)rawHi=rawDate;
    /* Hora fim */
    var rawHf=item.hf||item.hora_fim||item.endTime||item.end_time||item.horaFim||item.endHour||item.endDate||"";
    return{
      id:    parseInt(item.id||item.codigo||item.auctionId||item.auction_id||0),
      titulo:item.titulo||item.title||item.name||item.nome||item.description||"Sem titulo",
      inicio:extractDate(rawDate),
      hi:    extractTime(rawHi,"00:00"),
      hf:    extractTime(rawHf,"23:59"),
      canal: item.canal||item.channel||item.channelName||item.broadcastChannel||"",
      canal2:item.canal2||item.channel2||item.secondaryChannel||"",
      cidade:item.cidade||item.city||item.location||"",
      tipo:  item.tipo||item.type||item.auctionType||item.saleType||"Normal",
      org:   item.organizacao||item.organization||item.organizationName||"Remate Web",
      real:  item.realizador||item.organizer||"Programa Leiloes",
      vis:   item.visivel!==undefined?item.visivel:(item.visible!==undefined?item.visible:true),
      lances:item.lances!==undefined?item.lances:(item.bidsEnabled!==undefined?item.bidsEnabled:true),
      agenda:item.agenda!==undefined?item.agenda:(item.showInAgenda!==undefined?item.showInAgenda:true),
      regiao:item.regiao||item.region||item.state||"br",
    };
  }

  for(var i=0;i<data.length;i++){
    var raw=data[i];
    /* Flatten nested structures from panel API */
    var item=raw.auction||raw.leilao||raw;
    var m=mapItem(item);
    if(!m.id)continue;

    /* CUTOFF: skip eventos passados (17/05 para tras) - preserve local data */
    if(m.inicio && m.inicio<=CUTOFF_DATE){skipped++;continue;}

    var ex=fev(m.id);
    if(ex){
      /* Update non-operational fields only — preserve operadores, tipo_leilao, despesas */
      if(m.titulo)ex.titulo=m.titulo;
      if(m.inicio)ex.inicio=m.inicio;
      if(m.hi&&m.hi!=="00:00")ex.hi=m.hi;
      if(m.hf&&m.hf!=="23:59")ex.hf=m.hf;
      if(m.canal)ex.canal=m.canal;
      if(m.canal2)ex.canal2=m.canal2;
      if(m.cidade)ex.cidade=m.cidade;
      if(m.org)ex.organizacao=m.org;
      if(m.real)ex.realizador=m.real;
      ex.visivel=m.vis;ex.lances=m.lances;ex.agenda=m.agenda;
      upd++;
    } else {
      events.push(mk(m.id,m.titulo,m.inicio,m.hi,m.hf,
        m.canal,m.cidade,m.tipo,"","agendado",
        m.vis,m.lances,m.agenda,m.org,m.regiao,
        [],[],[],[],[],
        item.intermediario||"",item.contrato||"",item.empresa||"",
        m.canal2,0,0,[]));
      added++;
    }
  }

  if(!silent){
    var msg="Importacao concluida!\n+ "+added+" novos eventos futuros\n~ "+upd+" atualizados";
    if(skipped>0)msg+="\n(ignorados "+skipped+" eventos ate "+fd(CUTOFF_DATE)+")";
    alert(msg);
  }
  saveData();render();
  return{added:added,upd:upd,skipped:skipped};
}

      '<Style ss:ID="hdr">'+
        '<Font ss:Bold="1" ss:Size="10"/>'+
        '<Interior ss:Color="#1a5fa0" ss:Pattern="Solid"/>'+
        '<Font ss:Bold="1" ss:Color="#FFFFFF" ss:Size="10"/>'+
        '<Alignment ss:Horizontal="Center"/>'+
      '</Style>'+
      '<Style ss:ID="num"><NumberFormat ss:Format="0"/></Style>'+

      '<Style ss:ID="tm"><NumberFormat ss:Format="HH:MM"/></Style>'+
    '</Styles>\n'+
    '<Worksheet ss:Name="Realizados">\n'+
    '<Table>\n';

  /* Column widths */
  for(var c=0;c<COLS.length;c++)xml+='<Column ss:Width="'+COLS[c].w+'"/>\n';

  /* Header row */
  xml+='<Row ss:Height="20">';
  for(var c=0;c<COLS.length;c++)xml+='<Cell ss:StyleID="hdr"><Data ss:Type="String">'+esc(COLS[c].h)+'</Data></Cell>';
  xml+='</Row>\n';

  /* Data rows */
  for(var i=0;i<done.length;i++){
    var e=done[i];
    var hi=e.hi_real||e.hi;
    var hf=e.hf_real||e.hf;
    xml+='<Row ss:Height="16">';
    xml+=cell(e.id,true);
    xml+=cell(e.cod_fin||"",true);
    xml+=cell(e.titulo);
    xml+=cell(fd(e.inicio));
    xml+=cell(hi);
    xml+=cell(fd(e.inicio));

    xml+=cell(e.realizador||"Programa Leiloes");
    xml+=cell(e.canal||"");
    xml+=cell(e.canal2||"");
    xml+=cell(e.cidade||"");
    xml+=cell(e.servico1||"");
    xml+=cell(e.servico2||"");
    xml+=cell(e.servico3||"");
    xml+=cell(e.servico4||"");
    xml+=cell(e.intermediario||"");
    xml+=cell(e.contrato||"");
    xml+=cell(e.empresa||"");
    xml+=cell(e.obs||"");
    xml+='</Row>\n';

  xml+='</Table>\n'+
    '<WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel">'+
      '<FreezePanes/><FrozenNoSplit/>'+
      '<SplitHorizontal>1</SplitHorizontal>'+
      '<TopRowBottomPane>1</TopRowBottomPane>'+

function pasteFromClipboard(){
  if(navigator.clipboard&&navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(txt){
      var el=document.getElementById("json-in");
      if(el){el.value=txt;el.focus();}
    }).catch(function(){alert("Permissao de leitura da area de transferencia negada.\nUse Ctrl+V diretamente na caixa de texto.");});
  } else {
    alert("Use Ctrl+V diretamente na caixa de texto para colar.");
  }
}

function dl(content,name,type){
  var b=new Blob([content],{type:type});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

    localStorage.setItem("rw_studios",JSON.stringify(STUDIOS));
    localStorage.setItem("rw_events",JSON.stringify(events));
    if(API_TOKEN)localStorage.setItem("rw_token",API_TOKEN);
    else localStorage.removeItem("rw_token");
  }catch(e){}
}

function loadData(){
  try{
    var u=localStorage.getItem("rw_users");
    if(u){var p=JSON.parse(u);if(p&&p.length)USER_ACCOUNTS=p;}
    var pc=localStorage.getItem("rw_paycats");
    if(pc){var p=JSON.parse(pc);if(p&&p.length)PAY_CATS=p;}
    var st=localStorage.getItem("rw_studios");
    if(st){var p=JSON.parse(st);if(p&&p.length)STUDIOS=p;}
    var ev=localStorage.getItem("rw_events");
    if(ev){var p=JSON.parse(ev);if(p&&p.length)events=p;}
    var tok=localStorage.getItem("rw_token");
    if(tok){API_TOKEN=tok;API_OK=true;}
  }catch(e){}
}

/* ================================================================
   AUTH / USER
================================================================ */
function loginUser(){
  var lg=document.getElementById("lg-user").value.trim().toLowerCase();
  var pw=document.getElementById("lg-pass").value;
  var err=document.getElementById("lg-err");
  err.style.display="none";
  var u=USER_ACCOUNTS.find(function(x){return x.login===lg&&x.senha===pw;});
  if(!u){err.style.display="block";return;}
  applyUser(u);
  try{localStorage.setItem("rw_session",JSON.stringify({uid:u.uid,login:u.login}));}catch(e){}
}

function applyUser(u){
  CUser={uid:u.uid,id:u.opId||0,nome:u.nome,sg:u.sg,cor:u.cor,role:u.role,isAdmin:u.isAdmin,login:u.login,opId:u.opId};
  document.getElementById("us-ovl").style.display="none";
  document.getElementById("app").style.display="flex";
  document.getElementById("u-av").textContent=u.sg;
  document.getElementById("u-av").style.background=u.cor;
  document.getElementById("u-nm").textContent=u.nome;
  document.getElementById("u-rl").textContent=u.role;
  if(CUser.isAdmin)document.getElementById("btn-new").style.display="";
  else document.getElementById("btn-new").style.display="none";
  if(API_TOKEN)setApiStatus("ok","Conectado — API RemateWeb");
  else setApiStatus("err","Nao conectado");
  render();
}

function loadSession(){
  try{
    var s=localStorage.getItem("rw_session");if(!s)return false;
    var p=JSON.parse(s);
    var u=USER_ACCOUNTS.find(function(x){return x.uid===p.uid&&x.login===p.login;});
    if(!u)return false;
    applyUser(u);return true;
  }catch(e){return false;}
}

function logout(){
  CUser=null;
  try{localStorage.removeItem("rw_session");}catch(e){}
  document.getElementById("us-ovl").style.display="flex";
  document.getElementById("app").style.display="none";
  var err=document.getElementById("lg-err");if(err)err.style.display="none";
  var lp=document.getElementById("lg-pass");if(lp)lp.value="";
}

/* ================================================================
   GESTAO DE USUARIOS
================================================================ */
function vUsuarios(){
  if(!CUser.isAdmin)return'<div class="empty">&#128274; Apenas administradores.</div>';
  var html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
    '<span style="font-size:12px;color:var(--t2)">'+USER_ACCOUNTS.length+' usuarios cadastrados</span>'+
    '<button class="btn btn-a btn-sm" onclick="openUserModal(null)">+ Novo Usuario</button>'+
  '</div>'+
  '<div class="tw"><table><thead><tr>'+
    '<th>Login</th><th>Nome</th><th>Sigla</th><th>Area</th><th>Contrato</th><th>Admin</th><th></th>'+
  '</tr></thead><tbody>';
  for(var i=0;i<USER_ACCOUNTS.length;i++){
    var u=USER_ACCOUNTS[i];var op=u.opId?gop(u.opId):null;
    html+='<tr>'+
      '<td class="mono">'+u.login+'</td>'+
      '<td><span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:'+u.cor+';color:#fff;font-size:9px;font-weight:800;margin-right:6px">'+u.sg+'</span>'+u.nome+'</td>'+
      '<td class="mono">'+u.sg+'</td>'+
      '<td><span class="b bz">'+(op?op.tipo:u.isAdmin?"gestor":"—")+'</span></td>'+
      '<td>'+(op?empbdg(op.emp):'<span class="b bb">Gestor</span>')+'</td>'+
      '<td>'+(u.isAdmin?'<span class="b bg">&#10003;</span>':'')+'</td>'+
      '<td><div style="display:flex;gap:3px">'+
        '<button class="btn btn-s btn-xs" onclick="openUserModal('+u.uid+')">Editar</button>'+
        (u.uid!==0&&u.uid!==CUser.uid?'<button class="btn btn-r btn-xs" onclick="delUser('+u.uid+')">Excluir</button>':'')+
      '</div></td>'+
    '</tr>';
  }
  html+='</tbody></table></div>';
  return html;
}

function openUserModal(uid){
  var u=uid!==null?USER_ACCOUNTS.find(function(x){return x.uid===uid;}):null;
  sh(u?"Editar Usuario":"Novo Usuario",u?"@"+u.login:"");
  document.getElementById("modal").classList.add("modal-lg");
  var opOpts='<option value="">-- Nenhum (sem area operacional) --</option>'+
    OPERATORS.map(function(o){return'<option value="'+o.id+'"'+(u&&u.opId===o.id?" selected":"")+'>'+o.nome+' ('+o.tipo+')</option>';}).join("");
  mb('<div class="gr2">'+
    '<div class="fg"><label>Login</label><input id="um-lg" value="'+(u?u.login:'')+'" placeholder="usuario.login" autocomplete="off"></div>'+
    '<div class="fg"><label>'+(u?"Nova Senha (branco = manter)":"Senha")+'</label><input id="um-pw" type="password" placeholder="senha" autocomplete="new-password"></div>'+
  '</div>'+
  '<div class="gr2">'+
    '<div class="fg"><label>Nome Completo</label><input id="um-nm" value="'+(u?u.nome:'')+'" placeholder="NOME SOBRENOME"></div>'+
    '<div class="fg"><label>Sigla (2-3 letras)</label><input id="um-sg" maxlength="3" value="'+(u?u.sg:'')+'" placeholder="XX"></div>'+
  '</div>'+
  '<div class="gr2">'+
    '<div class="fg"><label>Cor</label><input id="um-cor" type="color" value="'+(u?u.cor:"#c25c1a")+'"></div>'+
    '<div class="fg"><label>Perfil Admin?</label><select id="um-adm">'+
      '<option value="0"'+(u&&!u.isAdmin?" selected":"")+'>Operador</option>'+
      '<option value="1"'+(u&&u.isAdmin?" selected":"")+'>Administrador / Gestor</option>'+
    '</select></div>'+
  '</div>'+
  '<div class="fg"><label>Vincular Operador</label><select id="um-op">'+opOpts+'</select></div>');
  mf('<button class="btn btn-s" onclick="cm()">Cancelar</button>'+
     '<button class="btn btn-a" onclick="saveUserModal('+(uid!==null?uid:'null')+')">Salvar</button>');
  openOvl();
}

function saveUserModal(uid){
  var lg=document.getElementById("um-lg").value.trim().toLowerCase();
  var pw=document.getElementById("um-pw").value;
  var nm=document.getElementById("um-nm").value.trim().toUpperCase();
  var sg=document.getElementById("um-sg").value.trim().toUpperCase();
  var cor=document.getElementById("um-cor").value;
  var adm=document.getElementById("um-adm").value==="1";
  var opId=parseInt(document.getElementById("um-op").value)||null;
  if(!lg||!nm||!sg){alert("Preencha login, nome e sigla.");return;}
  if(uid===null&&!pw){alert("Informe uma senha.");return;}
  var dup=USER_ACCOUNTS.find(function(x){return x.login===lg&&x.uid!==uid;});
  if(dup){alert("Login '"+lg+"' ja existe.");return;}
  var op=opId?gop(opId):null;
  var role=adm?"Admin / Gestor":(op?(op.emp==="funcionario"?"Funcionario":op.emp==="freelancer1"?"Freelancer 1":"Freelancer 2"):"Usuario");
  if(uid===null){
    var newUid=USER_ACCOUNTS.reduce(function(mx,u){return Math.max(mx,u.uid);},0)+1;
    USER_ACCOUNTS.push({uid:newUid,login:lg,senha:pw,nome:nm,sg:sg,cor:cor,isAdmin:adm,opId:opId,role:role});
  } else {
    var u=USER_ACCOUNTS.find(function(x){return x.uid===uid;});
    if(!u)return;
    u.login=lg;if(pw)u.senha=pw;u.nome=nm;u.sg=sg;u.cor=cor;u.isAdmin=adm;u.opId=opId;u.role=role;
  }
  saveData();cm();render();
}

function delUser(uid){
  if(!confirm("Excluir este usuario? Esta acao nao pode ser desfeita."))return;
  USER_ACCOUNTS=USER_ACCOUNTS.filter(function(u){return u.uid!==uid;});
  saveData();render();
}
